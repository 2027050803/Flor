<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Georgia,"Times New Roman",serif}
body{background:radial-gradient(circle at center,#17130a 0%,#090806 45%,#000 100%)}
#estrellas{position:fixed;inset:0;pointer-events:none}
.estrella{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.35;animation:parpadear 3s infinite alternate}
@keyframes parpadear{from{opacity:.15}to{opacity:.75}}
.inicio{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#211c0c 0%,#090807 48%,#000 100%);transition:opacity 2s ease,visibility 2s ease}
.inicio.oculto{opacity:0;visibility:hidden}
.frase{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:#f1d45c;font-size:clamp(1.7rem,7vw,3.4rem);font-weight:normal;letter-spacing:1px;text-shadow:0 0 10px rgba(255,215,70,.15),0 0 30px rgba(255,200,30,.1);opacity:0;pointer-events:none;transition:opacity 1.8s ease}
.frase.visible{opacity:1}.frase.salida{opacity:0}
#corazon{position:fixed;inset:0;opacity:0;transition:opacity 2s ease;pointer-events:none}
#corazon.visible{opacity:1}
.flor{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%) scale(0);opacity:0;animation:aparecer 1.1s forwards ease-out}
@keyframes aparecer{0%{transform:translate(-50%,-50%) scale(0);opacity:0}60%{transform:translate(-50%,-50%) scale(1.25);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.petalo{position:absolute;width:13px;height:18px;left:8px;top:5px;background:linear-gradient(135deg,#fff06a,#ffd21f);border-radius:50% 50% 45% 45%;transform-origin:50% 10px;box-shadow:0 0 7px rgba(255,214,45,.65)}
.p1{transform:rotate(0deg) translateY(-6px)}.p2{transform:rotate(60deg) translateY(-6px)}.p3{transform:rotate(120deg) translateY(-6px)}.p4{transform:rotate(180deg) translateY(-6px)}.p5{transform:rotate(240deg) translateY(-6px)}.p6{transform:rotate(300deg) translateY(-6px)}
.centro{position:absolute;width:10px;height:10px;left:10px;top:10px;z-index:5;border-radius:50%;background:radial-gradient(circle,#704000,#291400);box-shadow:0 0 5px rgba(255,170,30,.5)}
.petalo-caido{position:fixed;top:-30px;width:9px;height:14px;border-radius:50%;background:#f4d13f;opacity:.45;pointer-events:none;animation:caer linear forwards}
@keyframes caer{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(110vh) translateX(80px) rotate(360deg)}}
.brillo{position:fixed;width:4px;height:4px;border-radius:50%;background:#ffe66b;box-shadow:0 0 10px #ffe66b,0 0 20px #ffc400;opacity:0;animation:brillo 2s ease forwards}
@keyframes brillo{0%{transform:scale(0);opacity:0}50%{transform:scale(1.5);opacity:1}100%{transform:scale(.3);opacity:0}}
.indicador{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.35);font-family:Arial,sans-serif;font-size:.8rem;letter-spacing:2px;animation:respirar 2s infinite}
@keyframes respirar{50%{opacity:.3}}
</style>
</head>
<body>
<div id="estrellas"></div>
<div class="inicio" id="inicio">
<div class="frase visible" id="frase1">¿Pensaste que lo olvidé?</div>
<div class="indicador">toca la pantalla</div>
</div>
<div class="frase" id="frase2">Solo me tardé más de lo debido.</div>
<div id="corazon"></div>
<script>
const inicio=document.getElementById("inicio"),frase1=document.getElementById("frase1"),frase2=document.getElementById("frase2"),corazon=document.getElementById("corazon"),estrellas=document.getElementById("estrellas");
let iniciado=false;
for(let i=0;i<90;i++){const estrella=document.createElement("div");estrella.className="estrella";estrella.style.left=Math.random()*100+"%";estrella.style.top=Math.random()*100+"%";estrella.style.animationDelay=Math.random()*3+"s";estrellas.appendChild(estrella)}
function puntoCorazon(t){const x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);return{x,y}}
function crearFlor(x,y,retraso,escala=1){const flor=document.createElement("div");flor.className="flor";flor.style.left=x+"%";flor.style.top=y+"%";flor.style.animationDelay=retraso+"s";flor.style.transform=`translate(-50%, -50%) scale(${escala})`;flor.innerHTML=`<div class="petalo p1"></div><div class="petalo p2"></div><div class="petalo p3"></div><div class="petalo p4"></div><div class="petalo p5"></div><div class="petalo p6"></div><div class="centro"></div>`;corazon.appendChild(flor)}
function formarCorazon(){let numero=0;for(let t=0;t<Math.PI*2;t+=.095){const punto=puntoCorazon(t),x=50+punto.x*2.35,y=47-punto.y*2.35;crearFlor(x,y,numero*.055);numero++}for(let i=0;i<115;i++){const t=Math.random()*Math.PI*2,escala=Math.sqrt(Math.random())*.82,punto=puntoCorazon(t),x=50+punto.x*2.35*escala,y=47-punto.y*2.35*escala;crearFlor(x,y,numero*.018);numero++}}
function crearPetalos(){for(let i=0;i<35;i++){const petalo=document.createElement("div");petalo.className="petalo-caido";petalo.style.left=Math.random()*100+"%";petalo.style.animationDuration=6+Math.random()*7+"s";petalo.style.animationDelay=Math.random()*6+"s";document.body.appendChild(petalo)}}
function crearBrillos(){for(let i=0;i<25;i++){setTimeout(()=>{const brillo=document.createElement("div");brillo.className="brillo";brillo.style.left=20+Math.random()*60+"%";brillo.style.top=15+Math.random()*70+"%";document.body.appendChild(brillo);setTimeout(()=>brillo.remove(),2000)},i*300)}}
function comenzar(){if(iniciado)return;iniciado=true;frase1.classList.add("salida");inicio.classList.add("oculto");setTimeout(()=>{frase2.classList.add("visible")},1800);setTimeout(()=>{frase2.classList.remove("visible");frase2.classList.add("salida")},5000);setTimeout(()=>{corazon.classList.add("visible");formarCorazon();crearPetalos();crearBrillos()},6500)}
document.addEventListener("click",comenzar);
document.addEventListener("touchstart",comenzar,{passive:true});
</script>
</body>
</html>
